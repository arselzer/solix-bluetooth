[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "solix-link"
version = "0.1.0"
description = "Local Anker SOLIX monitoring and controls over Bluetooth and isolated native MQTT"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["bleak>=0.21", "cryptography>=41"]

[project.optional-dependencies]
server = ["aiohttp>=3.9,<4"]
mqtt = ["paho-mqtt>=2,<3"]

[project.scripts]
solix-link = "solix_link.cli:main"
solix-gen2 = "solix_link.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["solix_link*", "solix_gen2*"]
